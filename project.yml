name: OutLoud
options:
  bundleIdPrefix: com.outloud
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 575X4F2KCC
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  OutLoud:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
        com.apple.FamilyControls:
          enabled: 1
    info:
      path: Configuration/OutLoud-Info.plist
      properties:
        CFBundleDisplayName: OutLoud
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: OutLoud listens only while you complete a spoken intention.
        NSSpeechRecognitionUsageDescription: OutLoud recognizes the intention phrases you choose.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: OutLoud
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clarkohlenbusch.outloud
        PRODUCT_NAME: OutLoud
        CODE_SIGN_ENTITLEMENTS: Configuration/OutLoud.entitlements
    dependencies:
      - target: OutLoudShieldConfiguration
        embed: true
      - target: OutLoudShieldAction
        embed: true
      - target: OutLoudDeviceActivityMonitor
        embed: true

  OutLoudShieldConfiguration:
    type: app-extension
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
        com.apple.FamilyControls:
          enabled: 1
    info:
      path: Configuration/ShieldConfiguration-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShieldConfigurationExtension"
    sources:
      - path: Extensions/ShieldConfiguration
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clarkohlenbusch.outloud.shield-configuration
        PRODUCT_NAME: OutLoudShieldConfiguration
        CODE_SIGN_ENTITLEMENTS: Configuration/ShieldConfiguration.entitlements

  OutLoudShieldAction:
    type: app-extension
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
        com.apple.FamilyControls:
          enabled: 1
    info:
      path: Configuration/ShieldAction-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShieldActionExtension"
    sources:
      - path: Extensions/ShieldAction
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clarkohlenbusch.outloud.shield-action
        PRODUCT_NAME: OutLoudShieldAction
        CODE_SIGN_ENTITLEMENTS: Configuration/ShieldAction.entitlements

  OutLoudDeviceActivityMonitor:
    type: app-extension
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
        com.apple.FamilyControls:
          enabled: 1
    info:
      path: Configuration/DeviceActivityMonitor-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension"
    sources:
      - path: Extensions/DeviceActivityMonitor
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clarkohlenbusch.outloud.device-activity-monitor
        PRODUCT_NAME: OutLoudDeviceActivityMonitor
        CODE_SIGN_ENTITLEMENTS: Configuration/DeviceActivityMonitor.entitlements

  OutLoudTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: OutLoud
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clarkohlenbusch.outloud.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  OutLoud:
    build:
      targets:
        OutLoud: all
        OutLoudTests: [test]
    test:
      targets:
        - OutLoudTests
